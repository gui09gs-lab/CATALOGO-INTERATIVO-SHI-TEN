<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Montserrat","Segoe UI",Roboto,Arial,sans-serif;background:#212121;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px 16px;min-height:100%}
.caixa{width:100%;max-width:380px;text-align:center}
.caixa .logo{width:240px;max-width:80%;margin:0 auto 10px;display:block}
.faixa{height:5px;width:90px;background:#FDA700;margin:18px auto 22px;border-radius:3px}
h1{font-size:15px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 18px;color:#FDA700}
input[type=password]{width:100%;padding:14px;border-radius:10px;border:2px solid #444;background:#2d2d2d;color:#fff;font-size:16px;text-align:center}
input[type=password]:focus{outline:none;border-color:#FDA700}
label.lem{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0;font-size:14px;color:#ccc}
label.lem input{accent-color:#FDA700;width:18px;height:18px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#FDA700;color:#212121;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
button:disabled{opacity:.6}
.msg{min-height:22px;margin-top:12px;font-size:14px;color:#ff8a8a}
.fx{height:24px;width:auto;margin:28px auto 0;opacity:.7;display:block}

<script>
(async function(){
  const ITER=300000, CHAVE="st_chave";
  const $=id=>document.getElementById(id);
  const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
  const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
  let dados=null;
  async function baixar(){
    if(dados)return dados;
    const r=await fetch("catalogo.enc",{cache:"no-cache"}).catch(()=>caches.match("catalogo.enc"));
    if(!r||!r.ok)throw new Error("rede");
    const b=new Uint8Array(await r.arrayBuffer());
    if(String.fromCharCode(b[0],b[1],b[2])!=="ST2")throw new Error("formato");
    const sal=b.slice(3,19),n=b[19],pacotes=[];let o=20;
    for(let i=0;i<n;i++){const iv=b.slice(o,o+12);const t=((b[o+12]<<24)|(b[o+13]<<16)|(b[o+14]<<8)|b[o+15])>>>0;pacotes.push({iv,cif:b.slice(o+16,o+16+t)});o+=16+t}
    return dados={sal,pacotes};
  }
  async function derivar(senha,sal){
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(senha),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:sal,iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
  }
  async function decifrar(chave){ // cada senha abre só o pacote do seu perfil
    const d=await baixar();
    for(const p of d.pacotes){try{return await crypto.subtle.decrypt({name:"AES-GCM",iv:p.iv},chave,p.cif)}catch(_){}}
    throw new Error("senha");
  }
  async function abrir(plano){
    const html=await new Response(new Blob([plano]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    document.open();document.write(html);document.close();
  }
  // Chave lembrada (funciona offline)
  try{
    const s=JSON.parse(localStorage.getItem(CHAVE)||"null");
    if(s){const d=await baixar();if(s.sal===hex(d.sal)){const k=await crypto.subtle.importKey("raw",unhex(s.k),"AES-GCM",false,["decrypt"]);await abrir(await decifrar(k));return}else localStorage.removeItem(CHAVE)}
  }catch(e){if(e.message!=="rede"){try{localStorage.removeItem(CHAVE)}catch(_){}}}
  $("senha").focus();
  $("f").addEventListener("submit",async e=>{
    e.preventDefault();$("msg").textContent="";$("btn").disabled=true;$("btn").textContent="Abrindo…";
    try{
      const d=await baixar();const k=await derivar($("senha").value,d.sal);
      const plano=await decifrar(k);
      if($("lembrar").checked){try{localStorage.setItem(CHAVE,JSON.stringify({sal:hex(d.sal),k:hex(await crypto.subtle.exportKey("raw",k))}))}catch(_){}}
      await abrir(plano);
    }catch(err){
      $("msg").textContent=err.message==="senha"?"Senha incorreta.":err.message==="rede"?"Sem conexão. Abra uma vez com internet.":"Não foi possível abrir o catálogo.";
      $("btn").disabled=false;$("btn").textContent="Entrar";
    }
  });
})();
</script>
